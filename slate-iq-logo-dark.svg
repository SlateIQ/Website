<svg viewBox="325 132 614 238" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Slate-IQ (dark background version)</title>
<desc>Slate-IQ logo, reversed for use on dark backgrounds: white trendline with a two-tone chip reading SLATE (pale green) and IQ (green), and a football at the peak.</desc>

<line x1="371" y1="287" x2="830" y2="199" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
<circle cx="371" cy="287" r="5.5" fill="#FFFFFF"/>

<g transform="translate(864,193) rotate(-10.8) scale(1.3)">
  <ellipse cx="0" cy="0" rx="27" ry="16" fill="#00A94F"/>
  <line x1="-16" y1="0" x2="16" y2="0" stroke="#0B0E11" stroke-width="2"/>
  <line x1="-10" y1="-4.5" x2="-10" y2="4.5" stroke="#0B0E11" stroke-width="1.6"/>
  <line x1="-5" y1="-4.5" x2="-5" y2="4.5" stroke="#0B0E11" stroke-width="1.6"/>
  <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="#0B0E11" stroke-width="1.6"/>
  <line x1="5" y1="-4.5" x2="5" y2="4.5" stroke="#0B0E11" stroke-width="1.6"/>
  <line x1="10" y1="-4.5" x2="10" y2="4.5" stroke="#0B0E11" stroke-width="1.6"/>
</g>

<rect x="400" y="205" width="280" height="76" fill="#D7EFDE"/>
<text x="540" y="262" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="2" fill="#0B0E11" text-anchor="middle">SLATE</text>
<rect x="680" y="205" width="120" height="76" fill="#00A94F"/>
<text x="740" y="262" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" text-anchor="middle">IQ</text>

<text x="600" y="325" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="5" fill="#B7B5AC" text-anchor="middle">ANALYTICAL DFS PROJECTIONS</text>
</svg>
